version: "2"
run:
  concurrency: 4
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0 # 0 = unlimited (we want ALL issues)
  max-same-issues: 50

linters:
  enable:
    # correctness
    - govet # built-in checker: copylocks, printf formats, struct tags, unreachable code
    - staticcheck # extensive static analysis: deprecated APIs, common mistakes, simplifications
    - unused # unused variables, functions, types
    - errcheck # unchecked error returns and type assertions
    - errorlint # correct use of errors.Is/As and %w wrapping (Go 1.13+)
    - nilerr # returning nil error when err is non-nil
    - forcetypeassert # type assertions without comma-ok check
    - copyloopvar # loop variable copy issues (Go 1.22+)
    - durationcheck # detect time.Duration * time.Duration bugs
    - reassign # package-level variable reassignment
    # style
    - gocritic # opinionated style: unnecessary conversions, range copies, redundant code
    - revive # naming conventions, exported types, stuttered package names
    - whitespace # trailing whitespace, unnecessary blank lines
    - godot # exported-symbol comments must end with a period
    - misspell # common English misspellings in identifiers and comments
    - dupword # duplicate words in comments and strings (the the, is is)
    - predeclared # shadowing Go built-ins (len, cap, error, min, max)
    - errname # error type/var naming conventions (ErrFoo, FooError)
    - asciicheck # non-ASCII identifiers (prevents homoglyph/trojan source attacks)
    # complexity
    - gocyclo # cyclomatic complexity threshold
    - nestif # deeply nested if/else chains
    - funlen # function length limits (lines and statements)
    - dupl # code duplication detection
    # performance
    - perfsprint # faster alternatives to fmt.Sprintf
    - unconvert # unnecessary type conversions
    - ineffassign # assignments to variables never read
    - goconst # repeated literals that should be constants
    # security
    - gosec # security scanner — mainly integer-conversion checks in this codebase's wire/crypto code
    - bidichk # dangerous bidirectional Unicode sequences (trojan source CVE-2021-42574)
    # modernization & meta
    - modernize # old patterns replaceable with newer Go features
    - intrange # range over integer instead of C-style loop (Go 1.22+)
    - usestdlibvars # use stdlib constants instead of hardcoded values
    - exhaustive # switch statements not covering all enum values — useful for Status/FrameType
    - nolintlint # enforces proper //nolint directive usage
    - thelper # test helpers missing t.Helper()
    - usetesting # use t.Setenv/t.TempDir instead of os equivalents in tests

  disable:
    - lll # line length — handled by gofmt/gofumpt
    - prealloc # high false-positive rate; enable only after performance profiling
    - wrapcheck # forces wrapping all external errors — too noisy as a default
    - err113 # forces package-level sentinel errors — too opinionated, breaks common patterns
    - mnd # magic number detector — extremely noisy against protocol byte offsets and codec tables
    - iface # interface pollution detector — not mature enough
    - nakedret # naked returns — overlaps with funlen
    - noinlineerr # bans `if err := ...; err != nil {}` — this is idiomatic Go
    - gocognit # cognitive complexity — redundant with gocyclo + nestif
    - cyclop # cyclomatic complexity — redundant with gocyclo
    - depguard # import allow/deny lists — no need in a small, stdlib-heavy module
    - goheader # file header enforcement — project-specific policy, not adopted
    - importas # import alias enforcement — this codebase has no aliased imports
    - funcorder # function ordering — too opinionated for a default
    - godoclint # godoc validation — overlaps with godot and revive
    - varnamelen # variable name length — too opinionated, Go favors short names
    - exhaustruct # all struct fields must be set — breaks the zero-value idiom this codebase relies on
    - gochecknoglobals # no global variables — sentinel errors and lookup tables are globals by design here
    - gochecknoinits # no init() functions — this codebase has none, but no need to enforce
    - unparam # unused function parameters — medium false-positive rate; flags test helpers deliberately
    - makezero # flags make([]T, n) — noisy, often wrong about intent
    - testpackage # forces _test package — this codebase intentionally tests unexported internals
    - embeddedstructfieldcheck # embedded type placement — no embedded structs in this codebase
    - iotamixing # iota in mixed const blocks — very rare issue
    - unqueryvet # SELECT * detection — no SQL in this codebase
    - recvcheck # receiver type consistency — overlaps with gocritic
    - mirror # bytes/strings mirror patterns — very few real hits
    - protogetter # proto field access via getters — no protobuf in this codebase
    - spancheck # OpenTelemetry span checks — no OTel in this codebase
    - zerologlint # zerolog usage — no zerolog in this codebase
    - wsl_v5 # whitespace/blank-line rules — very opinionated, not adopted
    # not applicable: this is a pure-logic, no-I/O, embedded-target codebase
    - bodyclose # no HTTP in this codebase
    - noctx # no HTTP in this codebase
    - containedctx # no context.Context usage in this codebase (deliberately: pure logic, caller-driven ticks instead)
    - fatcontext # no context.Context usage in this codebase
    - sqlclosecheck # no SQL in this codebase
    - rowserrcheck # no SQL in this codebase
    - sloglint # no structured logging in this codebase (firmware logging is a later phase)
    - loggercheck # no structured logging in this codebase
    - testifylint # no testify in this codebase — plain stdlib testing throughout
    - paralleltest # tests are microsecond-fast pure-logic unit tests; parallelizing adds no value
    - exptostd # no golang.org/x/exp usage in this codebase

  exclusions:
    paths:
      - vendor$
      - third_party$
      - testutils$
      - examples$
    rules:
      # Multi-stage scenario tests (e.g. sim's T2 scenarios) legitimately
      # have more branches/length than production code without being
      # harder to read — splitting them up would hide, not clarify, a
      # single coherent scenario.
      - path: _test\.go
        linters:
          - gocyclo
          - funlen
          - dupl

  settings:
    dupl:
      threshold: 100 # lower => stricter (tokens)
    errcheck:
      check-type-assertions: true
    exhaustive:
      # This codebase's switches deliberately use `default:` for the
      # last state/type rather than listing it explicitly (e.g.
      # channel.Machine's three-state switches) — that's the idiom in
      # use here, not a gap.
      default-signifies-exhaustive: true
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 3
      min-occurrences: 4
    gocyclo:
      min-complexity: 13 # strict; lower => stricter
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - gofumpt
  disable:
    - gci # import grouping/ordering — gofumpt already handles standard grouping
    - goimports # import management — redundant with gofumpt
    - golines # line wrapping — too opinionated, can break readability
    - swaggo # swaggo comment formatting — no swaggo in this codebase
  settings:
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
